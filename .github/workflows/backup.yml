# Backup semanal do banco (Supabase), criptografado, guardado como artifact por 90 dias.
# Segredos necessários (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     string de conexão do Postgres (Session pooler, porta 5432)
#   BACKUP_PASSPHRASE   senha usada para criptografar o arquivo (guarde-a fora do GitHub)
# O repositório é público: por isso o arquivo é criptografado antes do upload.
name: Backup semanal

on:
  schedule:
    - cron: '0 9 * * 0' # todo domingo, 6h em São Paulo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Instalar o cliente do Postgres 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Gerar o dump e criptografar
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "Defina os segredos SUPABASE_DB_URL e BACKUP_PASSPHRASE." >&2
            exit 1
          fi
          name="habitos-$(date -u +%F)"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --schema=public --format=custom --no-owner --no-privileges \
            --file="$name.dump"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "$name.dump.gpg" "$name.dump"
          rm "$name.dump"
          echo "BACKUP_NAME=$name" >> "$GITHUB_ENV"
          ls -lh "$name.dump.gpg"

      - name: Guardar o arquivo
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}.dump.gpg
          retention-days: 90
          if-no-files-found: error
